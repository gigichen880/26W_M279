# =============================================================================
# Phase 2 joint grid — ISSUE #1 out-of-sample TUNING window (2008–2016)
# =============================================================================
# Identical grid to ablation_phase2_joint_shortlist.yaml, but restricted to the
# tuning window 2008–2016 so hyperparameter selection never sees the held-out
# test period (2017–2021). The selected config is then evaluated on the full
# 2008–2021 backtest and reported split into tuning (<=2016) vs held-out (2017+).
#
# Run (scai4):
#   PYTHONNOUSERSITE=1 OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8 \
#   NUMEXPR_NUM_THREADS=8 ~/m279iso/bin/python -m scripts.analysis.ablation.run_ablation \
#     --config configs/ablation_phase2_tune0816.yaml --plots none
#   then: python -m scripts.analysis.ablation.pareto_gmvp_report \
#     --summary results/tune0816/ablation_phase2_joint/ablation_summary.csv
# =============================================================================

base_config: "regime_covariance.yaml"

mode: grid

objective: model_gmvp_sharpe_mean

overrides:
  data:
    start_date: "2008-01-01"
    end_date: "2016-12-31"
  backtest:
    stride: 5
    refit_mode: "days"
    refit_every_days: 20
  # Fixed (non-varied) settings for this grid, applied as base overrides.
  # (In grid mode every `axes:` entry must carry `choices`, so fixed settings
  # live here, not under `axes:`.)
  model:
    transition_estimator: "soft"
    regime_aggregation: "soft"
    regime_weighting: "filtered"
  embedder:
    name: "pca"

axes:
  regime_clustering:
    key: model.regime_clustering
    choices:
      - label: agglomerative_ward
        model.regime_clustering:
          name: agglomerative_ward
          params: {}
      - label: fuzzy_cmeans
        model.regime_clustering:
          name: fuzzy_cmeans
          params: {}

  knn_metric:
    key: model.knn_metric
    choices:
      - l1
      - label: lp_p1
        model.knn_metric: lp
        model.knn_lp_p: 1

  pca_k:
    key: embedder.pca_k
    choices:
      - 40
      - 48

  tau:
    key: model.tau
    choices: [1.0, 2.0]

  k_neighbors:
    key: backtest.k_neighbors
    choices: [10, 50]

outputs:
  outdir: "results/tune0816/ablation_phase2_joint"
